    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Stage the attendance-history migration over a synthetic family schema
        working-directory: supabase/ci-parent
        run: cp ../migrations/20261005153000_family_attendance_history_pagination.sql supabase/migrations/
      - name: Start isolated Supabase and apply attendance-history migration
        working-directory: supabase/ci-parent
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

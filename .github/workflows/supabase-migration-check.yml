  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pin the CLI so setup does not need GitHub's rate-limited latest-release lookup.
          version: 2.119.0
      - name: Stage selected pending migrations in an isolated local Supabase project
        shell: bash
        run: |
          cp supabase/migrations/20260930120000_guard_cases_workflow.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930121500_guard_deadline_processor.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930123000_weekly_lateness_guard.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930194459_guard_school_day_deadlines_notifications.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930210000_guard_meeting_access_lock.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930220000_guard_school_day_absence.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930213000_official_school_terms.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930232834_kindergarten_pickup_workflow.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20260930233211_kindergarten_pickup_audit_source.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261001001600_kindergarten_private_relocation.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261001010212_student_kiosk_hide_student_id.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261001144429_preschool_competency_bulletins.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261001222000_school_calendar_year_successor.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261001222100_guard_meeting_reschedule_fix.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002100000_official_calendar_sources.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002120000_enable_pg_net_for_calendar_sources.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002121500_allow_secondary_calendar_source.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002125000_remove_calendar_test_pg_net.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002150000_calendar_document_kinds.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002151000_official_exam_date_proposals.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002151506_enforce_enabled_school_section_for_classes.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002153945_enforce_single_current_academic_year_per_school.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002200218_preschool_active_staff_role_scope.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002210335_allow_secretary_to_publish_preschool_bulletins.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002223000_preschool_bulletin_departure_history.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002233000_guard_active_parent_membership.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261002235000_kindergarten_pickup_minimize_view_data.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261003000000_limit_duplicate_preschool_pickup_updates.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261003023548_published_only_family_student_bulletins.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261003162629_confirm_official_exam_dates.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004000016_finance_accounting_core.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004010000_finance_overdue_restrictions.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004020000_finance_overpayment_credits.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004210000_finance_payment_ledger_pagination.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004220000_finance_payment_refunds.sql supabase/ci/supabase/migrations/
          cp supabase/migrations/20261004195614_kiosk_guard_scan_reasons.sql supabase/ci/supabase/migrations/
      - name: Start local Supabase and apply migrations
        working-directory: supabase/ci
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
      - name: Run rollback-only migration integration checks
        working-directory: supabase/ci
        shell: bash
        run: |
          db_container="$(docker ps --filter 'name=supabase_db_atechos-migration-check' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < verification.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < guard-verification.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < school-calendar-verification.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < official-exam-confirmation-verification.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < class-section-verification.sql
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < finance-verification.sql
      - name: Stop local Supabase
        if: always()
        working-directory: supabase/ci
        run: supabase stop --no-backup

  badge-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Stage the real badge lifecycle migration over a synthetic pre-lifecycle schema
        working-directory: supabase/ci-badge
        run: cp ../migrations/20260928004221_badge_lifecycle_history.sql supabase/migrations/
      - name: Start isolated Supabase and apply badge lifecycle migration
        working-directory: supabase/ci-badge
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
      - name: Run rollback-only badge credential, role and KIOS checks
        working-directory: supabase/ci-badge
        shell: bash
        run: |
          db_container="$(docker ps --filter 'name=supabase_db_atechos-badge-migration-check' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < badge-verification.sql
      - name: Stop badge verification Supabase
        if: always()
        working-directory: supabase/ci-badge
        run: supabase stop --no-backup

    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Stage the progression average fix over a focused synthetic schema
        working-directory: supabase/ci-progression
        run: cp ../migrations/20261005040000_progression_points_weighted_year_average.sql supabase/migrations/
      - name: Start isolated Supabase and apply the progression migration
        working-directory: supabase/ci-progression
        run: |
          supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local --no-seed
      - name: Verify point weighting, incomplete reports, threshold and tenant scope
        working-directory: supabase/ci-progression
        shell: bash
        run: |
          db_container="$(docker ps --filter 'name=supabase_db_atechos-progression-integrity-check' --format '{{.Names}}' | head -n 1)"
          test -n "$db_container"
          docker exec -i "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < progression-verification.sql
      - name: Stop progression verification Supabase
        if: always()
        working-directory: supabase/ci-progression
        run: supabase stop --no-backup

